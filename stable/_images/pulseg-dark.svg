<line class="arrow" x1="580" y1="150" x2="632" y2="130"/>
<rect class="core" x="640" y="105" rx="12" width="52" height="46"/><text class="white" x="666" y="135" text-anchor="middle">S1</text><rect class="core" x="698" y="105" rx="12" width="52" height="46"/><text class="white" x="724" y="135" text-anchor="middle">S1</text><rect class="core" x="756" y="105" rx="12" width="52" height="46"/><text class="white" x="782" y="135" text-anchor="middle">S1</text><rect class="a" x="814" y="105" rx="12" width="52" height="46"/><text class="small" x="840" y="135" text-anchor="middle">S2</text><rect class="core" x="872" y="105" rx="12" width="52" height="46"/><text class="white" x="898" y="135" text-anchor="middle">S1</text>
<text class="label" x="930" y="135">…</text>
<line class="bracket" x1="666" y1="155" x2="700" y2="195"/>
<rect class="a" x="640" y="195" rx="12" width="330" height="130"/><text class="small" x="805" y="229.5" text-anchor="middle">one segment instance:</text><text class="small" x="805" y="254.5" text-anchor="middle">amplitude scales s,</text><text class="small" x="805" y="279.5" text-anchor="middle">RF and ADC phase and frequency,</text><text class="small" x="805" y="304.5" text-anchor="middle">rotation R, block durations</text>
<text class="txt" x="500" y="400" text-anchor="middle">physical gradient  g(t) = R · s · ĝ(t)</text>
