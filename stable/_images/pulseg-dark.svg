<text class="title" x="475" y="36" text-anchor="middle">Virtual segments</text>
<text class="title" x="805" y="36" text-anchor="middle">Execution stream</text>
<rect class="box" x="40" y="60" rx="10" width="230" height="62"/><text class="txt" x="58" y="99">B1</text><line class="base" x1="105" y1="108" x2="255" y2="108"/><polyline class="rf" points="130.0,98.0 131.2,97.1 132.3,96.3 133.5,95.5 134.7,95.0 135.8,94.7 137.0,94.7 138.2,95.1 139.3,95.8 140.5,96.8 141.7,98.0 142.8,99.3 144.0,100.7 145.2,101.9 146.3,102.9 147.5,103.5 148.7,103.6 149.8,103.2 151.0,102.1 152.2,100.3 153.3,98.0 154.5,95.2 155.7,91.9 156.8,88.4 158.0,84.9 159.2,81.4 160.3,78.3 161.5,75.7 162.7,73.7 163.8,72.4 165.0,72.0 166.2,72.4 167.3,73.7 168.5,75.7 169.7,78.3 170.8,81.4 172.0,84.9 173.2,88.4 174.3,91.9 175.5,95.2 176.7,98.0 177.8,100.3 179.0,102.1 180.2,103.2 181.3,103.6 182.5,103.5 183.7,102.9 184.8,101.9 186.0,100.7 187.2,99.3 188.3,98.0 189.5,96.8 190.7,95.8 191.8,95.1 193.0,94.7 194.2,94.7 195.3,95.0 196.5,95.5 197.7,96.3 198.8,97.1 200.0,98.0"/><polyline class="wave" points="112,108 133.2,96 196.8,96 218,108"/>
<rect class="box" x="40" y="135" rx="10" width="230" height="62"/><text class="txt" x="58" y="174">B2</text><line class="base" x1="105" y1="183" x2="255" y2="183"/><polyline class="wave" points="110,183 138,157 222,157 250,183"/><rect class="adc" x="140" y="187" width="80" height="6"/>
<rect class="box" x="40" y="210" rx="10" width="230" height="62"/><text class="txt" x="58" y="249">B3</text><line class="base" x1="105" y1="258" x2="255" y2="258"/><polyline class="wave" points="140,258 156,228 204,228 220,258"/>
<rect class="box" x="40" y="285" rx="10" width="230" height="62"/><text class="txt" x="58" y="324">B4</text><line class="base" x1="105" y1="333" x2="255" y2="333"/><text class="label" x="150" y="327">delay</text>
<text class="label" x="155" y="372" text-anchor="middle">normalised waveforms, deduplicated</text>
