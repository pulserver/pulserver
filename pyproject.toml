[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=3.0", "setuptools>=69"]
build-backend = "scikit_build_core.build"

[project]
name = "pulserver"
version = "0.1.0"
description = "Pulseq MRI sequence runtime — contracts, C library, and reconstruction server"
readme = "README.rst"
license = { file = "LICENSE.txt" }
requires-python = ">=3.10"
authors = [{ name = "pulserver" }]
dependencies = []

[project.optional-dependencies]
sequence = ["pypulseq>=1.5.0", "scipy", "numpy>=2.0", "matplotlib", "mri-nufft"]
recon = [
  "numpy>=2.0",
  "ismrmrd>=1.14.1",
  "pydicom",
  "h5py",
  "psutil",
  "SimpleITK>=2.3",
]
# The reconstruction primitives use mri-nufft rather than maintaining a
# second NUFFT implementation.  ``recon-cpu`` is the portable default;
# ``recon-cuda`` selects the CUFINUFFT backend on Linux/CUDA hosts.
recon-cpu = [
  "pulserver[recon]",
  "torch>=2.12",
  "mri-nufft[finufft]",
  "finufft",
  "mrpro",
  "deepinv>=0.4",
  "ptwt",
  "PyWavelets",
]
recon-cuda = [
  "pulserver[recon-cpu]",
  # CUFINUFFT accepts Torch tensors directly. Avoid MRI-NUFFT's CuPy extra:
  # Pulserver registers its private Torch-native adapter at runtime.
  "cufinufft>=2.4; platform_system == 'Linux'",
]
recon-torchio = ["pulserver[recon-cpu]", "torchio>=0.20"]
recon-sim = ["pulserver[recon]", "torchsim"]
# PyHySCO is GPL-3.0-only.  It remains an opt-in external executable and is
# neither imported nor bundled by the MIT-licensed Pulserver package.
recon-distortion = ["PyHySCO"]
host = ["pulserver[sequence]"]
vre = ["pulserver[recon]"]
test = ["pytest>=8.2", "pytest-cov>=5.0"]
dev = ["pulserver[host,vre,test]", "ruff>=0.6", "pre-commit>=3.8"]
doc = [
  "pulserver[sequence]",
  "sphinx>=7.4",
  "myst-parser>=3.0",
  "sphinx-book-theme>=1.1",
  "matplotlib",
]

[tool.scikit-build]
cmake.source-dir = "."
sdist.include = [
  "csrc/**",
  "cxx/**",
  "examples/sequences/**",
  "examples/recon/**",
  "python/**",
  "tests/**",
  "README.rst",
  "LICENSE.txt",
]

[tool.scikit-build.wheel]
# scikit-build-core maps package paths to arbitrary source directories.  This
# installs the self-contained bridge plugins directly as
# ``pulserver.sequences.<name>`` without copying or moving their source.
packages = { "pulserver" = "python/pulserver", "pulserver/sequences" = "examples/sequences", "pulserver/examples/recon" = "examples/recon" }
# Source kept in the repository to port physics from, not importable and of no
# use to an installed package.
exclude = ["pulserver/design/_disabled/**"]

# Formatting + linting using ruff.
[tool.ruff]
line-length = 88
fix = true
extend-exclude = [
  "__init__.py",
  "docs/**",
  "external/**",
  # Not imported, and written against a module protocol that no longer exists.
  # Linting it would rewrite code whose only job is to be read while porting.
  "python/pulserver/design/_disabled/**",
  "tests/utils/pulseq/**",
]
exclude = ["docs/**"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# RUFF section
[tool.ruff.lint]
select = [
  "A",
  "ARG",
  "B",
  "C4",
  "COM",
  "F",
  "I",
  "NPY",
  "RUF",
  "S",
  "SIM",
  "PIE",
  "PTH",
  "Q",
  "W",
  "YTT",
]
ignore = [
  "E501",   # line too long
  "W191",   # tabs
  "E203",   # spacing before ':'
  "COM812", # missing trailing comma
  "Q000",
  "Q001",
  "Q002",   # quote rules handled by Ruff formatter
  "I001",
  "I002",   # import sorting intentionally not enforced
  "S101",
]
extend-ignore = [
  "E501", # line too long
  "W191", # tabs
  "E203", # colon spacing
]

[tool.ruff.lint.isort]
force-single-line = false
split-on-trailing-comma = false

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"

[tool.ruff.lint.pydocstyle]
convention = "numpy"

# Public handler and protocol interfaces deliberately retain their established
# argument names.  The recon server also accepts filesystem paths supplied by
# scanner configuration, where converting every intermediate value to Path
# would not improve safety or clarity.
[tool.ruff.lint.per-file-ignores]
"bridge/tests/test_plugin.py" = ["ARG001", "PTH123"]
"python/pulserver/design/_disabled/_readout/_surgery.py" = ["ARG001"]
"python/pulserver/design/_disabled/_readout/fse.py" = ["ARG002"]
"python/pulserver/io.py" = ["S324"]
"python/pulserver/recon/_mrd/connection.py" = ["A003", "PTH", "S108", "S110"]
"python/pulserver/recon/_mrd/constants.py" = ["A001"]
"python/pulserver/recon/_mrd/dicom2mrd.py" = ["S110"]
"python/pulserver/recon/distortion.py" = ["S603"]
"python/pulserver/recon/_mrd/handlers/savedataonly.py" = ["ARG001"]
"python/pulserver/recon/_mrd/main.py" = ["PTH", "S104", "S108"]
"python/pulserver/recon/_mrd/mrdhelper.py" = ["A002"]
"python/pulserver/recon/_mrd/readers.py" = ["A002", "ARG001", "PTH123"]
"python/pulserver/recon/_mrd/replay.py" = ["PTH", "S110"]
"python/pulserver/recon/_mrd/rtp_connection.py" = ["S104"]
"python/pulserver/recon/_mrd/server.py" = ["ARG001", "ARG004", "PTH", "S104", "S110"]
"python/pulserver/recon/_mrd/writers.py" = ["A002"]
"python/pulserver/sequences/_shim.py" = ["S102"]
"tests/python/test_sequences_repl.py" = ["S603"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra --import-mode=importlib"
