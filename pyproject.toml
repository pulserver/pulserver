[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=3.0", "setuptools>=69"]
build-backend = "scikit_build_core.build"

[project]
name = "pulserver"
version = "0.1.0"
description = "Pulseq MRI sequence runtime — contracts, C library, and reconstruction server"
readme = "README.rst"
license = { file = "LICENSE.txt" }
requires-python = ">=3.10"
authors = [
  { name = "INFN-MRI" },
]
dependencies = []

[project.optional-dependencies]
sequence  = ["pypulseq>=1.5.0", "scipy"]
analysis  = ["numpy>=2.0", "scipy", "matplotlib", "pypulseq", "ipywidgets"]
recon     = ["numpy", "ismrmrd>=1.14.1", "pydicom", "h5py", "psutil"]
host      = ["pulserver[sequence,analysis]"]
vre       = ["pulserver[recon]"]
test      = ["pytest>=8.2", "pytest-cov>=5.0"]
dev       = ["pulserver[host,vre,test]", "ruff>=0.6", "pre-commit>=3.8"]
doc       = [
  "pulserver[sequence]",
  "sphinx>=7.4",
  "myst-parser>=3.0",
  "sphinx-book-theme>=1.1",
  "matplotlib",
]

[tool.scikit-build]
cmake.source-dir = "."
sdist.include = [
  "csrc/**",
  "cxx/**",
  "examples/sequences/**",
  "python/**",
  "tests/**",
  "README.rst",
  "LICENSE.txt",
]

[tool.scikit-build.wheel]
# scikit-build-core maps package paths to arbitrary source directories.  This
# installs the self-contained bridge plugins directly as
# ``pulserver.sequences.<name>`` without copying or moving their source.
packages = { "pulserver" = "python/pulserver", "pulserver/sequences" = "examples/sequences" }

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["build", "build_tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts   = "-ra --import-mode=importlib"

[tool.black]
line-length = 120
target-version = ["py310"]
