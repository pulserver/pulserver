[build-system]
requires = ["scikit-build-core>=1.0.3", "pybind11>=3.1.0", "setuptools_scm[toml]>=8"]
build-backend = "scikit_build_core.build"

[project]
name = "pulserver"
description = "Orchestrator for MR acquisitions: sequence design, scanner preparation and reconstruction."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
license = "MIT"
license-files = ["LICENSE", "LICENSES/*"]
keywords = ["mri", "pulseq", "mrd", "ismrmrd", "reconstruction", "scanner"]
authors = [{ name = "Matteo Cencini", email = "matteo.cencini@gmail.com" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = ["pypulseqpp>=0.0.12", "numpy>=1.24", "ismrmrd>=1.14", "pydicom>=3.0"]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "coverage>=7.10",
  # Pinned, not ranged: a formatter that differs between a contributor and
  # CI makes "one entry point" a lie. Dependabot proposes the bumps.
  "ruff==0.16.5",
  "pre-commit>=4",
  "build",
]

doc = [
  "sphinx>=7.0",
  "sphinx-book-theme>=1.1",
  "myst-parser>=4.0",
  "linkify-it-py>=2.0",
  "sphinx-copybutton>=0.5",
  # The gallery: every script is executed while the pages are built, and
  # draws its figures with matplotlib.
  "sphinx-gallery>=0.18",
  "matplotlib>=3.8",
]

[project.scripts]
pulserver = "pulserver._cli:main"

[project.urls]
Homepage = "https://github.com/pulserver/pulserver"
Documentation = "https://pulserver.github.io/pulserver/"
Issues = "https://github.com/pulserver/pulserver/issues"
Source = "https://github.com/pulserver/pulserver"

[tool.scikit-build]
cmake.source-dir = "."
sdist.include = ["src/**", "tests/**", "README.md", "LICENSE", "LICENSES/**"]

[tool.scikit-build.wheel]
packages = { "pulserver" = "src/pulserver" }

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.setuptools_scm"

# No write_to: the version is read at runtime with importlib.metadata, which
# works the same under setuptools and under scikit-build-core. A generated
# _version.py only exists under one of them.
[tool.setuptools_scm]
version_scheme = "python-simplified-semver"
local_scheme = "no-local-version"
fallback_version = "0.0.0.dev0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "cuda: needs a CUDA device; skipped when none is present",
  "slow: excluded from the default run",
]

[tool.coverage.run]
# By package, not by directory: CI tests an installed wheel, not src/.
source_pkgs = ["pulserver"]
branch = true
# The design command, the reconstruction proxy and their workers run in child
# processes.
patch = ["subprocess"]

[tool.coverage.paths]
pulserver = ["src/pulserver", "*/site-packages/pulserver"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]

[tool.ruff]
line-length = 88
# Deliberately NOT `fix = true`: with it, `ruff check` rewrites the working
# tree, so a command that reads as read-only is not. `format_and_lint.sh`
# passes --fix explicitly when it means it.
fix = false
extend-exclude = ["docs/**", "examples/**"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["A", "ARG", "B", "C4", "D", "E", "F", "I", "NPY", "PIE", "PTH", "Q", "RUF", "S", "SIM", "UP", "W", "YTT"]
ignore = [
  "E501",   # line length is the formatter's business
  "COM812", # trailing comma conflicts with the formatter
  "D1",     # missing docstrings: write one only when it adds information
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "S603", "S607", "ARG", "RUF012"]
"benchmarks/**" = ["D", "S101", "T201"]
"__init__.py" = ["D104", "F401"]
# A gallery script's module docstring is the page's reStructuredText title
# block, which no docstring convention describes, and its imports are placed
# where the page introduces them rather than all at the top. A scanner
# sequence declares its `ui` as a class-level mapping, as a plugin file does.
"gallery/**" = ["D205", "D400", "D401", "E402", "RUF012"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"
