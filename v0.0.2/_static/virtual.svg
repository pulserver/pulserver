<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="t d">
<title id="t">The virtual scanner</title><desc id="d">The design calls write the IR cache, which a virtual interpreter plays through the C library; the Fourier engine acquires a phantom with coils along the played waveforms, and a virtual client streams MRD to the proxy and the recon plugin, which are production code</desc>
<style>
.box{fill:#eef4fa;stroke:#2b76ad;stroke-width:2}
.core{fill:#2b76ad;stroke:#174b70;stroke-width:2}
.a{fill:#fdf6e6;stroke:#ffb91f;stroke-width:2}
.txt{font:22px Arial,sans-serif;fill:#173042}
.white{font:23px Arial,sans-serif;fill:#ffffff;font-weight:bold}
.small{font:18px Arial,sans-serif;fill:#173042}
.label{font:16px Arial,sans-serif;fill:#657786}
.arrow{stroke:#657786;stroke-width:3;marker-end:url(#m)}
.head{fill:#657786}
.ink{fill:none;stroke:#12212b;stroke-width:5;stroke-linejoin:miter;stroke-linecap:butt}
.blue{fill:#3a77a8}
.amber{fill:#ffbe2e}
.word{fill:#356a57}
.orange{fill:#ffa00f}
.unit{stroke:#2a2a2a;stroke-width:4}
.trace{fill:none;stroke:#2a2a2a;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
.title{font:bold 20px Arial,sans-serif;fill:#173042}
.wave{fill:none;stroke:#3a77a8;stroke-width:3;stroke-linejoin:round}
.rf{fill:none;stroke:#ffbe2e;stroke-width:3;stroke-linejoin:round}
.adc{fill:#ffbe2e}
.base{fill:none;stroke:#657786;stroke-width:1.5}
.bracket{fill:none;stroke:#657786;stroke-width:2}
</style>
<defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path class="head" d="M0,0 L0,6 L9,3 z"/></marker></defs>
<rect class="box" x="40" y="20" rx="12" width="280" height="70"/><text class="txt" x="180" y="49.5" text-anchor="middle">Design calls</text><text class="txt" x="180" y="74.5" text-anchor="middle">pulserver</text>
<line class="arrow" x1="320" y1="55" x2="377" y2="55"/>
<rect class="a" x="380" y="20" rx="12" width="280" height="70"/><text class="small" x="520" y="49.5" text-anchor="middle">Virtual interpreter</text><text class="small" x="520" y="74.5" text-anchor="middle">plays the IR cache</text>
<line class="arrow" x1="660" y1="55" x2="717" y2="55"/>
<rect class="a" x="720" y="20" rx="12" width="240" height="70"/><text class="small" x="840" y="49.5" text-anchor="middle">Fourier engine</text><text class="small" x="840" y="74.5" text-anchor="middle">EPG + NUFFT</text>
<line class="arrow" x1="840" y1="210" x2="840" y2="93"/><text class="label" x="850" y="156.5">tissue</text>
<rect class="a" x="720" y="210" rx="12" width="240" height="70"/><text class="small" x="840" y="239.5" text-anchor="middle">Phantom, coils,</text><text class="small" x="840" y="264.5" text-anchor="middle">motion, GIRF</text>
<line class="arrow" x1="730" y1="90" x2="640" y2="207"/><text class="label" x="720" y="153.5" text-anchor="end">samples</text>
<rect class="a" x="380" y="210" rx="12" width="280" height="70"/><text class="small" x="520" y="239.5" text-anchor="middle">Virtual client</text><text class="small" x="520" y="264.5" text-anchor="middle">sends as the scanner does</text>
<line class="arrow" x1="380" y1="245" x2="323" y2="245"/>
<rect class="box" x="40" y="210" rx="12" width="280" height="70"/><text class="txt" x="180" y="239.5" text-anchor="middle">Proxy and your</text><text class="txt" x="180" y="264.5" text-anchor="middle">recon plugin</text>
<rect class="core" x="40" y="310" rx="12" width="920" height="50"/><text class="white" x="500" y="342" text-anchor="middle">Stand-ins (shaded) replace the scanner; everything else is production code</text>
</svg>
