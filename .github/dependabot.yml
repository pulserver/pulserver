version: 2
updates:
  # The Actions in .github/workflows pin third-party code that runs with
  # repository credentials, so these are the updates worth having weekly.
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: main
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/"
    target-branch: main
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "deps"
    groups:
      # The sequence engine's signatures are what the scanner plugins bind to,
      # so its bumps arrive alone and get a full run of their own.
      engine:
        patterns: ["pypulseqpp"]
      mr-data:
        patterns: ["numpy", "ismrmrd", "pydicom"]
      build:
        patterns: ["scikit-build-core", "pybind11", "setuptools_scm"]
      dev-tooling:
        patterns: ["pytest*", "coverage", "ruff", "pre-commit", "build"]
      docs:
        patterns: ["sphinx*", "myst-parser", "linkify-it-py", "matplotlib"]
