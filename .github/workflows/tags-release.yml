name: Publish Python 🐍 distribution 📦 to PyPI and GitHub Releases

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  sdist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build sdist
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  wheels:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build wheels with cibuildwheel
        env:
          # Supports Python >= 3.10 per pyproject
          CIBW_SKIP: "cp36-* cp37-* cp38-* cp39-* pp*"
          CIBW_ARCHS_MACOS: universal2
        run: |
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel
          python -m cibuildwheel --output-dir wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  # Build the bridge bundle using the PyPI release of pulserver.
  # Runs after publish-to-pypi so the tag is already available on PyPI.
  build-bridge-bundle:
    needs: [publish-to-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Nim
        run: |
          curl https://nim-lang.org/choosenim/init.sh -sSf | sh -s -- -y
          echo "$HOME/.nimble/bin" >> $GITHUB_PATH
      - name: Build bridge bundle (from PyPI release)
        env:
          # Use the just-published PyPI version, pinned to the release tag.
          PULSERVER_PIP_SPEC: "pulserver==${{ github.ref_name }}"
        run: |
          bash scripts/make_installer.sh pulserver_bridge_installer.sh
          # Repack as tar.gz: named pulserver_bridge_<tag>.tar.gz
          INSTALL_DIR="$(mktemp -d)"
          bash pulserver_bridge_installer.sh "$INSTALL_DIR"
          tar -czf "pulserver_bridge_${{ github.ref_name }}.tar.gz" -C "$INSTALL_DIR" .
      - uses: actions/upload-artifact@v4
        with:
          name: pulserver-bridge-bundle
          path: pulserver_bridge_${{ github.ref_name }}.tar.gz

  publish-to-pypi:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pulserver
    permissions:
      id-token: write  # required for trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [publish-to-pypi, build-bridge-bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to create releases
      id-token: write  # for sigstore
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: pulserver-bridge-bundle
          path: bundle
      - name: Sign the dists with Sigstore
        uses: sigstore/gh-action-sigstore-python@v2.1.1
        with:
          inputs: |
            ./dist/*.tar.gz
            ./dist/*.whl
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' --repo '${{ github.repository }}' --notes ""
      - name: Upload artifact signatures to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release upload '${{ github.ref_name }}' dist/** --repo '${{ github.repository }}'
      - name: Upload bridge bundle to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release upload '${{ github.ref_name }}' bundle/*.tar.gz --repo '${{ github.repository }}'
