name: Release

# Publishes a tagged version: the wheels and sdist from the reusable Wheels
# workflow, the Nim bridge bundle, then PyPI and a GitHub release.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  # The same job pull requests run, so what is published was built by the
  # configuration that has been exercised all along.
  build:
    uses: ./.github/workflows/wheels.yml
    with:
      cibw-build: "cp310-* cp311-* cp312-* cp313-*"

  publish-to-pypi:
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pulserver
    permissions:
      id-token: write # trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{wheels-*,sdist}"
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # The bridge bundle installs the published release, so it runs once PyPI has
  # the tag.
  build-bridge-bundle:
    needs: [publish-to-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Nim
        run: |
          curl https://nim-lang.org/choosenim/init.sh -sSf | sh -s -- -y
          echo "$HOME/.nimble/bin" >> $GITHUB_PATH
      - name: Build the bridge bundle
        env:
          PULSERVER_PIP_SPEC: "pulserver==${{ github.ref_name }}"
        run: |
          bash scripts/make_installer.sh pulserver_bridge_installer.sh
          INSTALL_DIR="$(mktemp -d)"
          bash pulserver_bridge_installer.sh "$INSTALL_DIR"
          tar -czf "pulserver_bridge_${{ github.ref_name }}.tar.gz" -C "$INSTALL_DIR" .
      - uses: actions/upload-artifact@v4
        with:
          name: pulserver-bridge-bundle
          path: pulserver_bridge_${{ github.ref_name }}.tar.gz
          if-no-files-found: error

  github-release:
    needs: [publish-to-pypi, build-bridge-bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sigstore
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{wheels-*,sdist}"
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: pulserver-bridge-bundle
          path: bundle
      - name: Sign the distributions with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: |
            ./dist/*.tar.gz
            ./dist/*.whl
      - name: Create the GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' \
            --repo '${{ github.repository }}' \
            --title '${{ github.ref_name }}' \
            --generate-notes
      - name: Upload the distributions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release upload '${{ github.ref_name }}' dist/** --repo '${{ github.repository }}'
      - name: Upload the bridge bundle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release upload '${{ github.ref_name }}' bundle/*.tar.gz --repo '${{ github.repository }}'
