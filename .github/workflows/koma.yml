name: KomaMRI

# Simulates, with the KomaMRI Bloch simulator, every fixture and every sequence
# pypulseqpp ships: as designed, and as the file virtual.export writes of what
# its cache plays, whose signals agree unless the cache plays something other
# than the design; and as that file in KomaMRI's RF convention, whose signal
# pypulseqpp's Bloch simulation of the cache reproduces. Every night against
# pypulseqpp's latest release, and on demand. The virtual scanner's own tests
# hold the cache to the design on every pull request.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: write # the Julia cache deletes the caches it has superseded
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # setuptools_scm reads the tags

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"

      - uses: julia-actions/cache@v3

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]

      - name: Install KomaMRI
        run: julia --project=tests/koma -e 'using Pkg; Pkg.instantiate()'

      # -ra so a skip is visible rather than reading as a pass.
      - name: Simulate
        env:
          PULSERVER_KOMA_PROJECT: tests/koma
          JULIA_NUM_THREADS: auto
        run: pytest -q -ra tests/test_koma.py
