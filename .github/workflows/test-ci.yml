name: Tests

# Every job runs scripts/run_tests.sh, the same entry point used locally. The
# lanes are split across jobs so a failure names the language it came from,
# and so the Python matrix does not rebuild the native suites for each version.
#
# There is one environment: `pip install .[dev]` brings the whole runtime --
# design and reconstruction -- plus the test and documentation tooling. The
# GPU extra is deliberately not installed, and the tests that need a device
# skip themselves, which is what these jobs also prove.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling of the supported band: an intermediate
        # release that fails on neither is not a plausible failure.
        python-version: ["3.11", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]

      - name: Run the Python lane
        run: bash scripts/run_tests.sh --only=python --coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4.0.1
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: pulserver/pulserver

  test-native:
    name: C and C++
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]

      # The C and C++ suites are built by the lanes themselves
      # (PULSERVER_BUILD_NATIVE=1, which run_tests.sh sets).
      - name: Run the C and C++ lanes
        run: bash scripts/run_tests.sh --only=native

  test-nim:
    name: Nim bridge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]

      - name: Install Nim
        run: |
          curl https://nim-lang.org/choosenim/init.sh -sSf | sh -s -- -y
          echo "$HOME/.nimble/bin" >> $GITHUB_PATH

      # run_tests.sh points PULSERVER_TEST_PIP_SPEC at this checkout, so the
      # bundle (and EnvPulserver) are built from the current branch.
      - name: Run the Nim lane
        run: bash scripts/run_tests.sh --only=nim

  # Proves the claim the dependency layout rests on: without the `cuda` extra
  # and without a device, nothing errors -- the GPU tests skip.
  gpu-tests-skip-cleanly:
    name: GPU tests skip without a GPU
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install without the cuda extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]

      - name: Collect and run the CUDA-dependent tests
        run: |
          bash scripts/run_tests.sh --only=python -rs \
            tests/python/recon/test_cuda_streaming.py \
            tests/python/recon/test_torch_cufinufft.py
