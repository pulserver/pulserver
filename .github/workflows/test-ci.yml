name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every platform a wheel ships for. Windows is not one: the warm design
        # server forks per call and listens on a Unix socket.
        os: [ubuntu-latest, macos-14]
        # The floor and the ceiling of the supported band: an intermediate
        # release that fails on neither is not a plausible failure.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # setuptools_scm reads the tags

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The 32-bit compiler the scanner-reader test builds with; without it
      # that test skips.
      - name: Install the 32-bit C toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]

      # -ra so a skip is visible rather than reading as a pass.
      - name: Run the tests
        run: pytest -q -ra --cov --cov-report=xml

      - uses: codecov/codecov-action@v7
        if: runner.os == 'Linux'
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: pulserver/pulserver

  sanitize:
    name: Isochromat engine under the sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A read past the end of an array is not a wrong answer but whatever
      # was there, which the tests above catch only when it changes a number.
      - name: Build the engine with the sanitizers on
        run: |
          g++ -std=c++17 -g -O1 \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -fno-omit-frame-pointer -pthread \
            -I src/cpp -o sanitize_bloch tests/native/sanitize_bloch.cpp \
            src/cpp/bloch/bloch.cpp src/cpp/bloch/events.cpp src/cpp/bloch/finufft.cpp \
            src/cpp/bloch/nufft.cpp src/cpp/bloch/repetitions.cpp

      - name: Play each of its paths
        run: ./sanitize_bloch

  device:
    name: Lattice windows read under Triton's interpreter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # setuptools_scm reads the tags

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      # torch's CPU build and Triton, whose interpreter runs the kernel where
      # there is no card; cuFINUFFT transforms on a card alone.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install triton .[dev]

      - name: Run the device tests
        run: pytest -q -ra tests/test_virtual_device.py --cov --cov-report=xml

      - uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: pulserver/pulserver

  coils:
    name: Coil models sampled by bartorch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # setuptools_scm reads the tags

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      # torch's CPU build: the coil models need no card.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install .[dev,coils]
          python -c "import bartorch.tools"

      - name: Run the coil tests
        run: pytest -q -ra tests/test_virtual_coils.py --cov

      - name: Run the bartorch reconstructions, navigator poses included
        run: pytest -q -ra --cov --cov-append tests/recon

      - name: Scan the console image's sequences, NUFFT reconstructions included
        run: pytest -q -ra --cov --cov-append --cov-report=xml tests/test_console_sequences.py

      # The NUFFT reconstruction runs only here, where bartorch is installed.
      - uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: pulserver/pulserver
