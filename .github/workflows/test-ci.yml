name: Tests

on:
  # A branch is tested once, through its pull request.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every platform a wheel ships for. Windows is not one: the warm design
        # server forks per call and listens on a Unix socket.
        os: [ubuntu-latest, macos-14]
        # The floor and the ceiling of the supported band: an intermediate
        # release that fails on neither is not a plausible failure.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # setuptools_scm reads the tags

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The 32-bit compiler the scanner-reader test builds with; without it
      # that test skips.
      - name: Install the 32-bit C toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib

      # torch is a dependency; on Linux its CPU build, not the CUDA one.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" = "Linux" ]; then
            python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          fi
          python -m pip install .[dev]

      # -ra so a skip is visible rather than reading as a pass. One worker per
      # core, each held to one thread, or every worker's pool spreads over
      # every core and they contend.
      - name: Run the tests
        env:
          OMP_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
        run: pytest -q -ra -n auto --cov --cov-report=xml

      - uses: codecov/codecov-action@v7
        if: runner.os == 'Linux'
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: pulserver/pulserver

  coils:
    name: Coil models sampled by bartorch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # setuptools_scm reads the tags

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      # torch's CPU build: the coil models need no card.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install .[dev,coils,design]
          python -c "import bartorch.tools, blochsim"

      - name: Run the coil tests
        run: pytest -q -ra tests/test_virtual_coils.py --cov

      - name: Run the bartorch reconstructions, navigator poses included
        run: pytest -q -ra --cov --cov-append tests/recon tests/test_exam_calibration.py

      - name: Evaluate the fse3d plugin's optimized refocusing trains
        run: pytest -q -ra --cov --cov-append tests/test_zoo_evaluation.py -k "OPTIMIZED or DUAL_REGION"

      - name: Scan the console image's sequences, NUFFT reconstructions included
        run: pytest -q -ra --cov --cov-append --cov-report=xml tests/test_console_sequences.py

      # The NUFFT reconstruction runs only here, where bartorch is installed.
      - uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: pulserver/pulserver
