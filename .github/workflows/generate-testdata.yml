name: Generate Test Data (MATLAB)

on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/generators/*.m'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          products: Signal_Processing_Toolbox

      - name: Install Pulseq toolbox
        run: |
          git clone --depth 1 https://github.com/pulseq/pulseq.git /tmp/pulseq-toolbox

      - name: Patch Pulseq toolbox for continuity test generator
        run: |
          # The grad continuity generator intentionally creates sequences
          # that violate gradient continuity.  Comment out the continuity
          # check in mr.Sequence/setBlock so the generator can run.
          SETBLOCK="/tmp/pulseq-toolbox/matlab/+mr/@Sequence/setBlock.m"
          if [ -f "$SETBLOCK" ]; then
            sed -i '1032,1096s/^/%/' "$SETBLOCK" 2>/dev/null || true
          fi

      - name: Run MATLAB generators
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath('/tmp/pulseq-toolbox/matlab');
            cd('tests/generators');
            generate_grad_continuity_test_cases;
            generate_grad_limits_test_cases;
            generate_once_flag_test_cases;
            generate_rf_test_cases;
            generate_segmentation_test_sequences;

      - name: Move generated files to tests/data
        run: |
          mkdir -p tests/data
          find tests/generators -maxdepth 1 \
            \( -name '*.seq' -o -name '*.csv' -o -name '*.txt' -o -name '*.dat' \) \
            -exec mv {} tests/data/ \;

      - name: Commit and push generated test data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: regenerate MATLAB test data"
            git push
          fi
