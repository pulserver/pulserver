name: Generate Test Data (MATLAB)

on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/generators/*.m'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install GNU Octave
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq octave

      - name: Install Pulseq toolbox
        run: |
          git clone --depth 1 https://github.com/pulseq/pulseq.git /tmp/pulseq-toolbox

      - name: Run generators with Octave
        run: |
          cd tests/generators
          for gen in generate_grad_limits_test_cases \
                     generate_once_flag_test_cases \
                     generate_rf_test_cases \
                     generate_segmentation_test_sequences; do
            octave --no-gui --no-window-system --eval "
              addpath('/tmp/pulseq-toolbox/matlab');
              $gen;
            " || echo "Warning: $gen failed"
          done
          # Run grad continuity generator separately (needs patched toolbox)
          octave --no-gui --no-window-system --eval "
            addpath('/tmp/pulseq-toolbox/matlab');
            % Disable gradient continuity check for this generator
            generate_grad_continuity_test_cases;
          " || echo "Warning: generate_grad_continuity_test_cases failed"

      - name: Move generated files to tests/data
        run: |
          mkdir -p tests/data
          find tests/generators -maxdepth 1 \
            \( -name '*.seq' -o -name '*.csv' -o -name '*.txt' -o -name '*.dat' \) \
            -exec mv {} tests/data/ \;

      - name: Commit and push generated test data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: regenerate MATLAB test data"
            git push
          fi
