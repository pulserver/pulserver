# pulserver's image, whose default command is the console of the virtual
# scanner reconstructing in its own process: built, scanned through in the
# head coils, which bartorch samples, and published from main. An exam on
# BrainWeb then downloads it from BrainWeb's server, after publishing, so that
# the server's availability does not hold the image back.
name: Image

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - docker/**
      - src/**
      - tests/plugins/gre2d.py
      - pyproject.toml
      - CMakeLists.txt
      - .dockerignore
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: docker build -f docker/Dockerfile -t pulserver .
      - name: Scan through its console
        run: |
          docker run -d --name console -p 127.0.0.1:8765:8765 pulserver
          pip install websockets pydicom numpy
          python docker/smoke.py ws://127.0.0.1:8765 head8/head32
      - name: Publish
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in latest "${{ github.sha }}"; do
            docker tag pulserver "ghcr.io/pulserver/pulserver:$tag"
            docker push "ghcr.io/pulserver/pulserver:$tag"
          done
      - name: Start an exam on BrainWeb, downloaded from its server
        run: python docker/smoke.py ws://127.0.0.1:8765 body/head48 --subject brainweb --exam-only
      - name: Logs
        if: always()
        run: docker logs console
