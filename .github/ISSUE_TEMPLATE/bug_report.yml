name: Bug report
description: Report reproducible incorrect behaviour or a documentation defect.
labels: ["bug"]
body:
  - type: dropdown
    id: subsystem
    attributes:
      label: Affected area
      options:
        - "Scanner sequences (pulserver.design, pulserver.protocol)"
        - "Design calls and the design store (pulserver.host)"
        - "IR conversion or the C cache library (pulserver.ir, src/c)"
        - "Reconstruction proxy and enrichment (pulserver.proxy)"
        - "Reconstruction plugins and MRD data (pulserver.recon, pulserver.mrd)"
        - "Documentation"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed and expected behaviour
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Smallest reproducer
      description: >
        Self-contained Python code, a plugin file, a minimal `.seq` file, or the
        design call and its reply. Prefer synthetic data to a scanner
        acquisition.
      render: python
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: pulserver, pypulseqpp and Python versions, plus OS and architecture.
      placeholder: "pulserver 0.x; pypulseqpp 0.x; Python 3.12; Ubuntu 24.04 x86-64"
    validations:
      required: true
