name: Feature request
description: Propose a narrowly scoped addition to pulserver.
labels: ["enhancement"]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Scientific or technical use case
      description: State the missing capability and the acquisition or reconstruction workflow it serves.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed interface or behaviour
      description: Include primary literature, a vendor or MRD convention, or an existing implementation where relevant.
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Where it belongs
      description: >
        Sequence design belongs to pypulseqpp and reconstruction algorithms to
        bartorch; pulserver holds the orchestration between them and the scanner.
      options:
        - "pulserver"
        - "pypulseqpp (sequence design)"
        - "bartorch (reconstruction)"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
