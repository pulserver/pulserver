# The rules live in scripts/format_and_lint.sh, which the Style workflow also
# runs (there with --check). One entry point means a commit cannot pass locally
# and fail in CI on style.
#
# Test fixtures are sequence files as pypulseqpp writes them: a whitespace hook
# does not rewrite them.
exclude: ^tests/fixtures/
repos:
  - repo: local
    hooks:
      - id: format-and-lint
        name: format and lint
        entry: bash scripts/format_and_lint.sh
        language: system
        pass_filenames: false
        types_or: [python, markdown]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: mixed-line-ending
        args: [--fix=lf]
