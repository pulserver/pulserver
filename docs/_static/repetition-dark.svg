<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" role="img" aria-labelledby="t d">
<title id="t">A repetition tiled over the execution stream</title><desc id="d">Three virtual segments S1, S2 and S3 form one repetition, which is played N times; the segment IDs of the stream are stored once per period as (S1 S2 S3) times N, and each instance keeps its own parameters</desc>
<style>
.box{fill:#13293a;stroke:#5b9bd0;stroke-width:2}
.core{fill:#2b76ad;stroke:#8fc3e8;stroke-width:2}
.a{fill:#2a2415;stroke:#ffbe2e;stroke-width:2}
.txt{font:22px Arial,sans-serif;fill:#dce7f0}
.white{font:23px Arial,sans-serif;fill:#ffffff;font-weight:bold}
.small{font:18px Arial,sans-serif;fill:#dce7f0}
.label{font:16px Arial,sans-serif;fill:#93a7b5}
.arrow{stroke:#93a7b5;stroke-width:3;marker-end:url(#m)}
.head{fill:#93a7b5}
.ink{fill:none;stroke:#e8eef3;stroke-width:5;stroke-linejoin:miter;stroke-linecap:butt}
.blue{fill:#5b9bd0}
.amber{fill:#ffbe2e}
.word{fill:#8fc3e8}
.title{font:bold 20px Arial,sans-serif;fill:#dce7f0}
.wave{fill:none;stroke:#5b9bd0;stroke-width:3;stroke-linejoin:round}
.rf{fill:none;stroke:#ffbe2e;stroke-width:3;stroke-linejoin:round}
.adc{fill:#ffbe2e}
.base{fill:none;stroke:#93a7b5;stroke-width:1.5}
.bracket{fill:none;stroke:#93a7b5;stroke-width:2}
</style>
<defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path class="head" d="M0,0 L0,6 L9,3 z"/></marker></defs>
<rect class="core" x="40" y="40" rx="12" width="62" height="46"/><text class="white" x="71" y="70" text-anchor="middle">S1</text>
<rect class="box" x="108" y="40" rx="12" width="62" height="46"/><text class="txt" x="139" y="70" text-anchor="middle">S2</text>
<rect class="a" x="176" y="40" rx="12" width="62" height="46"/><text class="small" x="207" y="70" text-anchor="middle">S3</text>
<rect class="core" x="254" y="40" rx="12" width="62" height="46"/><text class="white" x="285" y="70" text-anchor="middle">S1</text>
<rect class="box" x="322" y="40" rx="12" width="62" height="46"/><text class="txt" x="353" y="70" text-anchor="middle">S2</text>
<rect class="a" x="390" y="40" rx="12" width="62" height="46"/><text class="small" x="421" y="70" text-anchor="middle">S3</text>
<rect class="core" x="468" y="40" rx="12" width="62" height="46"/><text class="white" x="499" y="70" text-anchor="middle">S1</text>
<rect class="box" x="536" y="40" rx="12" width="62" height="46"/><text class="txt" x="567" y="70" text-anchor="middle">S2</text>
<rect class="a" x="604" y="40" rx="12" width="62" height="46"/><text class="small" x="635" y="70" text-anchor="middle">S3</text>
<rect class="core" x="722" y="40" rx="12" width="62" height="46"/><text class="white" x="753" y="70" text-anchor="middle">S1</text>
<rect class="box" x="790" y="40" rx="12" width="62" height="46"/><text class="txt" x="821" y="70" text-anchor="middle">S2</text>
<rect class="a" x="858" y="40" rx="12" width="62" height="46"/><text class="small" x="889" y="70" text-anchor="middle">S3</text>
<text class="txt" x="694" y="70" text-anchor="middle">…</text>
<polyline class="bracket" points="40,96 40,104 238,104 238,96"/><text class="label" x="139" y="126" text-anchor="middle">repetition 1</text>
<polyline class="bracket" points="254,96 254,104 452,104 452,96"/><text class="label" x="353" y="126" text-anchor="middle">repetition 2</text>
<polyline class="bracket" points="468,96 468,104 666,104 666,96"/><text class="label" x="567" y="126" text-anchor="middle">repetition 3</text>
<polyline class="bracket" points="722,96 722,104 920,104 920,96"/><text class="label" x="821" y="126" text-anchor="middle">repetition N</text>
<line class="arrow" x1="500" y1="140" x2="500" y2="178"/>
<rect class="box" x="160" y="182" rx="12" width="680" height="86"/><text class="txt" x="500" y="219.5" text-anchor="middle">segment IDs, run-length encoded over one period: (S1 S2 S3) &#215; N</text><text class="txt" x="500" y="244.5" text-anchor="middle">each instance keeps its own parameters</text>
</svg>
